name: Portal checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "work/**"]

jobs:
  pricing-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run pricing tests
        run: npm run test:pricing
