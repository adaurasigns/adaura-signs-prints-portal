<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdAura Signs & Prints</title><style>
:root{--gold:#c5a15b;--ink:#17191c;--paper:#f5f4f1;--line:#e7e2d8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Arial,sans-serif}.bar{background:#151619;color:#fff;border-bottom:3px solid var(--gold);padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font:24px Georgia,serif}.brand span{color:var(--gold)}button,.btn{border:0;border-radius:8px;padding:11px 16px;background:var(--gold);font-weight:700;cursor:pointer}.ghost{background:transparent;color:white;border:1px solid #777}.wrap{max-width:1120px;margin:auto;padding:28px 20px}.hero{background:#202124;color:white;padding:45px 5%;}.hero h1{font:42px Georgia,serif;margin:0 0 10px}.hero em{color:var(--gold);font-style:normal}.muted{color:#777}.tools{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}input,select,textarea{padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit;min-width:0}input[type=search]{flex:1;min-width:220px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:18px}.card h3{margin:5px 0}.card p{color:#666;font-size:13px}.price{font-weight:700;color:#80602a;font-size:18px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:16px}.modal.show{display:grid}.panel{background:white;padding:24px;border-radius:14px;width:min(440px,100%);max-height:90vh;overflow:auto}.panel label{display:block;margin:12px 0 5px;font-size:13px}.panel input,.panel select,.panel textarea{width:100%}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{padding:8px;background:#fff4da;border-radius:8px;font-size:13px}.basket{position:sticky;bottom:0;background:#17191c;color:white;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;gap:10px}.hidden{display:none!important}#message{margin:10px 0;color:#8c2b20}@media(max-width:600px){.hero h1{font-size:32px}.bar{padding:14px 18px}.brand{font-size:20px}}
</style></head><body><header class="bar"><div class="brand">Ad<span>Aura</span> Signs & Prints</div><div class="row"><span id="who"></span><button class="ghost" id="account">Sign in</button></div></header><section class="hero"><h1>Ideas made visible.<br><em>Print with confidence.</em></h1><p>Printing, signage and display solutions. Select products and send us your requirements for a quotation.</p><button onclick="document.querySelector('#catalogue').scrollIntoView({behavior:'smooth'})">Browse catalogue</button></section><main class="wrap" id="catalogue"><h2>Product catalogue</h2><div class="tools"><input id="search" type="search" placeholder="Search products"><select id="category"><option value="">All categories</option></select><button id="reload">Refresh</button></div><div id="notice" class="status">Loading catalogue…</div><div id="products" class="grid"></div><h2>Your enquiries</h2><div id="myEnquiries" class="muted">Sign in to view enquiries.</div></main><div class="basket"><span><b id="count">0</b> items selected</span><button id="viewBasket">Review enquiry</button></div><div class="modal" id="modal"><div class="panel" id="panel"></div></div><script>
const $=id=>document.getElementById(id);let data={products:[],variants:[]},basket=[],me=null;
const api=async(url,opts={})=>{const r=await fetch('/api'+url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j};
function show(html){$('panel').innerHTML=html;$('modal').classList.add('show')}function close(){$('modal').classList.remove('show')}
$('modal').onclick=e=>{if(e.target===$('modal'))close()};
function account(){if(me){show('<h2>My account</h2><p>'+me.name+' · '+me.email+'</p><p>Account: '+me.account_status+'</p><button id="logout">Sign out</button> <button class="ghost" id="close">Close</button>');$('logout').onclick=async()=>{await api('/auth/logout',{method:'POST'});me=null;close();await init()};$('close').onclick=close;return}
show('<h2>Sign in</h2><div id="err"></div><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><div class="row" style="margin-top:16px"><button id="login">Sign in</button><button class="ghost" id="register">Create account</button></div><button class="ghost" id="close" style="margin-top:10px">Cancel</button>');
$('login').onclick=async()=>{try{me=(await api('/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})})).user;close();await init()}catch(e){$('err').textContent=e.message}};
$('register').onclick=()=>registerForm();$('close').onclick=close}
function registerForm(){show('<h2>Create customer account</h2><div id="err"></div><label>Name</label><input id="name"><label>Email</label><input id="email" type="email"><label>Phone</label><input id="phone"><label>Password (10+ characters)</label><input id="password" type="password"><label>Customer type</label><select id="type"><option value="b2c">Individual</option><option value="b2b">Business</option></select><label>Business name (if applicable)</label><input id="business"><label>GSTIN (if applicable)</label><input id="gstin"><button id="create" style="margin-top:16px">Create account</button> <button class="ghost" id="back">Back</button>');$('back').onclick=account;$('create').onclick=async()=>{try{me=(await api('/auth/register',{method:'POST',body:JSON.stringify({name:$('name').value,email:$('email').value,phone:$('phone').value,password:$('password').value,customer_type:$('type').value,business_name:$('business').value,gstin:$('gstin').value})})).user;close();await init()}catch(e){$('err').textContent=e.message}}}
function render(){const q=$('search').value.toLowerCase(),cat=$('category').value;const ps=data.products.filter(p=>(!cat||p.category===cat)&&[p.name,p.category,p.description].join(' ').toLowerCase().includes(q));$('products').innerHTML=ps.map(p=>{const vs=data.variants.filter(v=>v.product_id===p.id);return '<article class="card"><small>'+p.category+'</small><h3>'+p.name+'</h3><p>'+p.description+'</p>'+vs.map(v=>'<div class="row" style="justify-content:space-between;margin:10px 0"><span>'+v.name+'<br><small>'+v.quantity_unit+'</small></span><span class="price">'+(v.unit_price_inclusive===null?'Sign in for price':'₹'+Number(v.unit_price_inclusive).toFixed(2))+'</span><button data-add="'+v.id+'">Add</button></div>').join('')+'</article>'}).join('')||'<div class="card">No matching products. The catalogue may not have been loaded yet.</div>';$('products').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.add),x=basket.find(x=>x.id===id);if(x)x.qty++;else basket.push({id,qty:1});updateBasket()});}
function updateBasket(){$('count').textContent=basket.reduce((n,x)=>n+x.qty,0)}
async function loadEnquiries(){if(!me){$('myEnquiries').textContent='Sign in to view your enquiries.';return}try{const x=await api('/my/enquiries');$('myEnquiries').innerHTML=x.enquiries.map(e=>'<div class="card">'+e.enquiry_number+' · '+e.status+' · ₹'+e.subtotal_inclusive+'</div>').join('')||'No enquiries yet.'}catch(e){$('myEnquiries').textContent=e.message}}
$('viewBasket').onclick=()=>{if(!basket.length)return show('<h2>Your enquiry is empty</h2><button id="close">Close</button>');const lines=basket.map(x=>{const v=data.variants.find(v=>v.id===x.id),p=data.products.find(p=>p.id===v.product_id);return '<div class="row"><span>'+p.name+' — '+v.name+'</span><input type="number" min="1" max="10000" value="'+x.qty+'" data-qty="'+x.id+'" style="width:75px"></div>'}).join('');show('<h2>Review enquiry</h2>'+lines+'<label>Notes / specifications</label><textarea id="notes"></textarea><label>Contact phone</label><input id="phone" value="'+(me?.phone||'')+'"><label>Delivery location</label><input id="delivery"><p id="err"></p><button id="send">Submit enquiry</button> <button class="ghost" id="close">Continue shopping</button>');$('close').onclick=close;$('send').onclick=async()=>{if(!me){close();account();return}try{document.querySelectorAll('[data-qty]').forEach(i=>{const x=basket.find(x=>x.id===Number(i.dataset.qty));x.qty=Number(i.value)});const x=await api('/enquiries',{method:'POST',body:JSON.stringify({items:basket.map(x=>({variant_id:x.id,quantity:x.qty})),customer_notes:$('notes').value,contact_phone:$('phone').value,delivery_location:$('delivery').value})});basket=[];updateBasket();close();alert('Enquiry submitted: '+x.enquiry.enquiry_number);await loadEnquiries()}catch(e){$('err').textContent=e.message}}};
$('account').onclick=account;$('reload').onclick=init;$('search').oninput=render;$('category').onchange=render;
async function init(){try{me=(await api('/auth/me')).user;data=await api('/catalogue');const cats=[...new Set(data.products.map(p=>p.category))];$('category').innerHTML='<option value="">All categories</option>'+cats.map(c=>'<option>'+c+'</option>').join('');$('notice').textContent=me?'Signed in as '+me.name+' · '+me.account_status:'Browse catalogue. Sign in to see your customer prices and submit enquiries.';$('account').textContent=me?'My account':'Sign in';$('who').textContent=me?.name||'';render();await loadEnquiries()}catch(e){$('notice').textContent=e.message}}init();
</script></body></html>
