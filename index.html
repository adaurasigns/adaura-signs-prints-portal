async function order(){
 const m=$("#m"),t=price(),p=PRODUCTS[pi];
 if(!file||!/\.(cdr|pdf)$/i.test(file.name)){m.textContent="Please choose your artwork file (CDR or PDF only).";return}
 if(file.size>20*1048576){m.textContent="File is too large. Maximum size is 20 MB.";return}
 if(t>W.balance){m.textContent="Not enough balance. Add money in the Wallet tab.";return}
 const btn=$("#buy");btn.disabled=true;m.textContent="Uploading file…";
 try{
  const as=await claude.use("assets");if(!as)throw new Error("File upload isn’t available for your account.");
  const up=await as.upload(file);
  const me=await (await claude.use("user")).me();
  const o={id:uuid(),item:p.n,opts:p.o.map(([l,c],i)=>c[pick[i]||0][0]).join(" · ")+(p.m?" · "+sets*p.m+" "+(p.u||"cards"):""),total:t,fname:file.name,url:up.url,assetId:up.id,at:Date.now(),by:(me&&me.name)||uid,done:false};
  const nw={...W,balance:W.balance-t,orders:[o,...W.orders],tx:[{d:Date.now(),t:"Order "+o.id.slice(-6)+" · "+p.n,a:-t,b:W.balance-t},...(W.tx||[])]};await db.collection("orders").doc(o.id).set(o);await wref().set(nw);W=nw;
  file=null;tab="orders";msg="Order placed and paid from wallet.";render();
 }catch(e){W=W;m.textContent=(e&&e.message)||"Something went wrong. Please try again.";btn.disabled=false}
}
