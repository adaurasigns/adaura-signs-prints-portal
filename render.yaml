services:
  - type: web
    name: adaura-signs-prints-portal
    runtime: node
    plan: starter
    branch: work/no-supabase-rebuild
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: adaura-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: AdAura Administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
