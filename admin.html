<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdAura Admin</title><style>body{font:15px Arial;background:#f4f3ef;margin:0;color:#222}.top{background:#17191c;color:#fff;padding:18px 5%;border-bottom:3px solid #c5a15b}.wrap{max-width:1100px;margin:auto;padding:24px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button{padding:10px 14px;border:0;border-radius:7px;background:#c5a15b;cursor:pointer;font-weight:bold}.tabs button{background:#e5e0d6}.card{background:white;border:1px solid #e5e0d6;border-radius:10px;padding:16px;margin:10px 0;overflow:auto}input,select,textarea{padding:9px;border:1px solid #ddd;border-radius:6px;margin:4px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:9px;border-bottom:1px solid #eee}#login{max-width:380px;margin:10vh auto}.hidden{display:none}.muted{color:#777}</style></head><body><header class="top"><b>AdAura Signs & Prints — Administration</b></header><main class="wrap"><section id="login" class="card"><h2>Administrator sign in</h2><input id="email" type="email" placeholder="Admin email" style="width:90%"><input id="password" type="password" placeholder="Password" style="width:90%"><button id="signin">Sign in</button><p id="err"></p></section><section id="app" class="hidden"><div><b id="welcome"></b> <button id="logout">Sign out</button></div><nav class="tabs"><button data-tab="summary">Overview</button><button data-tab="customers">Customers</button><button data-tab="products">Products</button><button data-tab="enquiries">Enquiries</button><button data-tab="orders">Orders</button><button data-tab="pricing">Pricing</button></nav><div id="content"></div></section></main><script>
const $=id=>document.getElementById(id);const api=async(p,o={})=>{const r=await fetch('/api'+p,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...o});const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'Request failed');return x};let tab='summary';
$('signin').onclick=async()=>{try{const x=await api('/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});if(x.user.role!=='admin')throw Error('This account is not an administrator.');await boot()}catch(e){$('err').textContent=e.message}};
$('logout').onclick=async()=>{await api('/auth/logout',{method:'POST'});location.reload()};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
async function boot(){const x=await api('/auth/me');if(!x.user||x.user.role!=='admin')return;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='Signed in: '+x.user.name;render()}
async function render(){const c=$('content');c.innerHTML='Loading…';try{if(tab==='summary'){const x=await api('/admin/summary');c.innerHTML='<div class="card"><h2>Overview</h2>'+Object.entries(x).map(([k,v])=>'<p><b>'+k.replaceAll('_',' ')+'</b>: '+v+'</p>').join('')+'</div>'}
if(tab==='customers'){const x=await api('/admin/customers');c.innerHTML='<h2>Customers</h2>'+x.customers.map(u=>'<div class="card"><b>'+u.name+'</b> · '+u.email+' · '+u.customer_type+' · '+u.business_name+'<p>GSTIN: '+(u.gstin||'—')+' · Status: '+u.account_status+'</p><select id="s'+u.id+'"><option>pending</option><option>approved</option><option>blocked</option></select> <button onclick="status('+u.id+')">Save status</button></div>').join('')}
if(tab==='products'){const x=await api('/admin/products');c.innerHTML='<h2>Products</h2><div class="card"><h3>Add product</h3><input id="pn" placeholder="Product name"><input id="pc" placeholder="Category"><input id="ps" placeholder="SKU"><input id="pd" placeholder="Description"><button onclick="addProduct()">Save product</button></div>'+x.products.map(p=>'<div class="card"><b>#'+p.id+' '+p.name+'</b> · '+p.category+'<p>'+p.description+'</p><button onclick="addVariant('+p.id+')">Add variant</button><p>'+x.variants.filter(v=>v.product_id===p.id).map(v=>v.name+' · supplier ₹'+v.supplier_rate_inclusive+' · GST '+v.gst_rate_percent+'%').join('<br>')+'</p></div>').join('')}
if(tab==='enquiries'){const x=await api('/admin/enquiries');c.innerHTML='<h2>Enquiries</h2>'+x.enquiries.map(e=>'<div class="card"><b>'+e.enquiry_number+'</b> · '+e.customer_name+' · ₹'+e.subtotal_inclusive+' · '+e.status+'<p>'+e.items.map(i=>i.product_name+' / '+i.variant_name+' × '+i.quantity).join('<br>')+'</p><select id="e'+e.id+'"><option>new</option><option>reviewing</option><option>quoted</option><option>accepted</option><option>rejected</option><option>closed</option></select> <button onclick="updateEnquiry('+e.id+')">Update</button> <button onclick="convert('+e.id+')">Convert to order</button></div>').join('')}
if(tab==='orders'){const x=await api('/admin/orders');c.innerHTML='<h2>Orders</h2>'+x.orders.map(o=>'<div class="card"><b>'+o.order_number+'</b> · '+o.customer_name+' · ₹'+o.total_inclusive+'<p>Status: '+o.status+' · Payment: '+o.payment_status+'</p><select id="o'+o.id+'"><option>confirmed</option><option>artwork_pending</option><option>artwork_approved</option><option>production</option><option>quality_check</option><option>dispatched</option><option>delivered</option><option>cancelled</option></select> <button onclick="updateOrder('+o.id+')">Update status</button></div>').join('')}
if(tab==='pricing'){const x=await api('/admin/pricing'),s=x.settings;c.innerHTML='<h2>Pricing rules</h2><div class="card">B2B markup % <input id="b2b" type="number" value="'+s.b2b_markup_percent+'"><br> B2B minimum addition ₹ <input id="min" type="number" value="'+s.b2b_minimum_addition+'"><br>B2C markup % <input id="b2c" type="number" value="'+s.b2c_markup_percent+'"><br><button onclick="savePricing()">Save pricing</button></div>'}
}catch(e){c.textContent=e.message}}
window.status=async id=>{await api('/admin/customers/'+id,{method:'PATCH',body:JSON.stringify({account_status:$('s'+id).value})});render()};
window.addProduct=async()=>{await api('/admin/products',{method:'POST',body:JSON.stringify({name:$('pn').value,category:$('pc').value,sku:$('ps').value,description:$('pd').value})});render()};
window.addVariant=async id=>{const name=prompt('Variant name?');if(!name)return;const rate=prompt('Supplier rate inclusive of GST (₹)?');if(rate===null)return;const gst=prompt('GST rate % (confirm with CA)','18');await api('/admin/variants',{method:'POST',body:JSON.stringify({product_id:id,name,supplier_rate_inclusive:Number(rate),gst_rate_percent:Number(gst),quantity_unit:'pack'})});render()};
window.updateEnquiry=async id=>{await api('/admin/enquiries/'+id,{method:'PATCH',body:JSON.stringify({status:$('e'+id).value})});render()};
window.convert=async id=>{const x=await api('/admin/enquiries/'+id+'/convert',{method:'POST'});alert('Created '+x.order_number);render()};
window.updateOrder=async id=>{await api('/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({status:$('o'+id).value})});render()};
window.savePricing=async()=>{await api('/admin/pricing',{method:'PUT',body:JSON.stringify({b2b_markup_percent:Number($('b2b').value),b2b_minimum_addition:Number($('min').value),b2c_markup_percent:Number($('b2c').value)})});alert('Pricing saved')};
boot();
</script></body></html>
